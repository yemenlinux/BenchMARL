# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions


name: torchrl_stable_tests

on:
  push:
    branches: [ $default-branch , "main" ]
  pull_request:
    branches: [ $default-branch , "main" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install FFmpeg runtime libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg
        sudo ldconfig
    - name: Install dependencies
      run: |
       bash .github/unittest/install_dependencies.sh
    
    # Meltingpot needs Python 3.11 which relies heavily on 
    # dmlab2d, which currently does not provide pre-built PyPI wheels for Python 3.12
    # For now, use .github/workfow/meltingpot_tests.yml workflow instead of torchrl_stable_tests.yml workflow
    # - name: Install meltingpot
    #   run: |
    #     bash .github/unittest/install_meltingpot.sh
    - name: Install vmas
      run: |
       bash .github/unittest/install_vmas.sh
    - name: Install urbanmarl
      run: |
       bash .github/unittest/install_urbanmarl.sh
    - name: Install pettingzoo
      run: |
       bash .github/unittest/install_pettingzoo.sh
    - name: Tests
      run: |
        xvfb-run -s "-screen 0 1024x768x24" pytest \
        test/test_pettingzoo.py \
        test/test_algorithm.py \
        test/test_models.py \
        test/test_task.py \
        test/test_vmas.py \
        test/test_urbanmarl.py --doctest-modules --junitxml=junit/test-results.xml --cov=. --cov-report=xml --cov-report=html
